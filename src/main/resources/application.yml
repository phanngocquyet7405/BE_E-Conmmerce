    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}   # 7 Ngày
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}
  sepay:
    api-key: ${SEPAY_API_KEY:}
    account-number: ${SEPAY_ACCOUNT_NUMBER:0123456789}
    bank-name: ${SEPAY_BANK_NAME:MBBank}
    account-holder: ${SEPAY_ACCOUNT_HOLDER:NGUYEN VAN A}
    qr-template: ${SEPAY_QR_TEMPLATE:compact}
  brevo:
    api-key: ${BREVO_API_KEY:}
