spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}

    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 5000ms

logging:
  level:
    root: WARN
    com.ecommerce: INFO
