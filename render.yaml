services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_AUTO_INDEX_CREATION
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION_MS
        value: "3600000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
